# EXS.LV Local Development Nginx Configuration
# Place this file in /etc/nginx/sites-available/exs-dev and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name localhost dev.exs.lv exs.test;

    # Adjust path to your local repository location
    root /var/www/exs-lv/exs.lv;
    index index.php;

    client_max_body_size 120M;

    location / {
        if (-f $request_filename) {
            break;
        }
        if (!-f $request_filename) {
            rewrite ^/(.+)$ /index.php?fakeurl=$1 last;
            break;
        }
    }

    location /api/ {
        rewrite ^/api/(.*)$ /modules/api/index.php?params=$1 last;
    }

    location ~ /dati/bildes/topic-av/(.*\.jpg) {
        expires 1d;
        try_files $uri /index.php?viewcat=page-avatars&img=$1;
    }

    location /js/ {
        expires 3h;
        rewrite ^/js/(.*\.js) /combine.php?type=javascript&files=$1;
    }

    location /css/ {
        expires 3h;
        rewrite ^/css/(.*\.css) /combine.php?type=css&files=$1;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.tpl {
        deny all;
    }
}
